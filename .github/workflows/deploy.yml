name: deploy

# Deploys the Worker from GitHub, so no laptop with wrangler is needed,
# and only a commit whose checks passed. On main the deploy runs after
# the ci workflow finishes and only when it succeeded, on that run's
# exact commit; a manual run deploys the commit it was started on and
# first looks up the ci result for that same commit, so a red or absent
# check stops it too. Wrangler reads CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID from the environment; the Discord values and the
# stats salt are pushed into the Worker's encrypted secret store on each
# run, so rotating one is a change to the GitHub secret and a re-run.
# Without a Cloudflare token the job says so and stops, so a push never
# fails for want of setup.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A ci run that failed or was cancelled never reaches the steps.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The commit being deployed: the ci run's head on main, the chosen ref on a manual run.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Require a green ci run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$DEPLOY_SHA" --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "ci for $DEPLOY_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci has not passed for $DEPLOY_SHA (result: $conclusion); nothing deployed"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npx wrangler deploy
      - name: Set the Worker's secrets
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STATS_SALT: ${{ secrets.STATS_SALT }}
        run: |
          for name in DISCORD_PUBLIC_KEY DISCORD_BOT_TOKEN STATS_SALT; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name is not set in GitHub secrets; left as is."; continue; fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
      - name: Check the deployed Worker answers
        if: env.skip != 'true'
        run: |
          sleep 5
          curl -sS --fail --max-time 20 https://bot.kairosarchive.net/
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{"type":1}' https://bot.kairosarchive.net/)
          echo "unsigned POST: HTTP $code (401 expected)"
          [ "$code" = "401" ]
