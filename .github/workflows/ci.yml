name: ci

# Every push and pull request: lint, type-check, the unit tests (which
# never touch the network: every dependency is a fake), and a dry-run
# bundle, which is what a deploy would upload. The deploy workflow runs
# after this one on main and only when it succeeded.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: Summary
        run: ls -la dist && wc -c dist/index.js
