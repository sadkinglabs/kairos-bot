name: register

# Pushes the slash commands in src/commands.ts to Discord and uploads the
# threshold emojis, from the Actions tab. Give a guild id to register to
# one server (instant); leave it empty for global (up to an hour to show).
# Run it after every change to src/commands.ts.

on:
  workflow_dispatch:
    inputs:
      guild:
        description: "Discord server id for a guild-scoped registration (empty: global)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Register
        env:
          DISCORD_APPLICATION_ID: "1549899039384797244"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ inputs.guild }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then echo "DISCORD_BOT_TOKEN is not set in GitHub secrets."; exit 1; fi
          node scripts/register.mjs
