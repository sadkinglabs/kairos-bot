# Weekly dependency updates; the Actions pins above are commit SHAs, so
# Dependabot moves the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
    ignore:
      # TypeScript 7 is the rewritten compiler; typescript-eslint does not
      # run on it yet. Same hold as the site repo.
      - dependency-name: typescript
        versions: [">=7"]
