name: deploy

# Deploys the Worker from GitHub, so no laptop with wrangler is needed:
# every push to main, and on demand from the Actions tab. Wrangler reads
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from the environment;
# the two Discord values are pushed into the Worker's encrypted secret
# store on each run, so rotating one is a change to the GitHub secret and
# a re-run. Without a Cloudflare token the job says so and stops, so a
# push never fails for want of setup.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npx wrangler deploy
      - name: Set the Worker's secrets
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STATS_SALT: ${{ secrets.STATS_SALT }}
        run: |
          for name in DISCORD_PUBLIC_KEY DISCORD_BOT_TOKEN STATS_SALT; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name is not set in GitHub secrets; left as is."; continue; fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
      - name: Check the deployed Worker answers
        if: env.skip != 'true'
        run: |
          sleep 5
          curl -sS --fail --max-time 20 https://bot.kairosarchive.net/
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{"type":1}' https://bot.kairosarchive.net/)
          echo "unsigned POST: HTTP $code (401 expected)"
          [ "$code" = "401" ]
